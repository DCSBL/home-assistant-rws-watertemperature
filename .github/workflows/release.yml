name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*", "v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "CalVer version to release, e.g. 2026.9.1 (the tag is created on the selected branch)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set manifest version
        run: |
          version="${VERSION#v}"
          jq --arg v "$version" '.version = $v' \
            custom_components/rws_watertemperature/manifest.json > manifest.tmp
          mv manifest.tmp custom_components/rws_watertemperature/manifest.json

      - name: Zip integration
        working-directory: custom_components/rws_watertemperature
        run: zip -r "$GITHUB_WORKSPACE/rws_watertemperature.zip" . -x '__pycache__/*'

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: rws_watertemperature.zip
          generate_release_notes: true
